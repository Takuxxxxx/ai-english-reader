services:
  - type: web
    name: ai-english-reader
    runtime: node
    buildCommand: npm install --workspaces && npm run build -w client && npm run build -w server
    startCommand: npm start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
